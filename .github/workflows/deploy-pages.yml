name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/nifty-carson-bxaazm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          STATIC_EXPORT: "true"
          # ── 배포 주소 전환 스위치 ────────────────────────────────
          # [현재] 커스텀 도메인 루트(www.safori.cloud):  public/CNAME 로 지정, basePath 없음
          # [되돌림] github.io 하위 경로: public/CNAME 을 지우고 아래를 추가
          #          NEXT_PUBLIC_BASE_PATH: /Safori-Web

      # 최초 1회: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 지정해야 합니다.
      # (워크플로 토큰으로는 Pages 사이트를 생성할 권한이 없습니다.)
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
