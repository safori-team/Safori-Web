name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/nifty-carson-bxaazm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          STATIC_EXPORT: "true"
          # 커스텀 도메인(www.safori.cloud)은 루트로 서빙되므로 basePath 없음.
          # github.io 하위 경로로 되돌릴 일이 생기면 NEXT_PUBLIC_BASE_PATH: /Safori-Web 을 다시 넣으세요.

      # 최초 1회: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 지정해야 합니다.
      # (워크플로 토큰으로는 Pages 사이트를 생성할 권한이 없습니다.)
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
